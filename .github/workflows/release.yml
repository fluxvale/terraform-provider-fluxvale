# The provider's release engineering — moved from the monorepo's
# tfprovider-release.yml (fluxvale/fluxvale) and made registry-ready:
# plain vX.Y.Z tags (the registries list semver; the provider is this
# repo's sole product, so the tf-v* namespace the monorepo needed is
# gone), and the registry's release-asset shape — the convention the
# official scaffolding and live provider releases (github/datadog/
# docker) settle: one zip per platform carrying ONLY the binary, plus
# versioned terraform-provider-fluxvale_<version>_manifest.json,
# _SHA256SUMS (covering the zips AND the manifest), and the BINARY
# GPG-detached _SHA256SUMS.sig (the registry spec: binary, not
# ASCII-armored) over a dedicated company key.
#
# Version wiring: the tag NAMES the release; the BINARY's version comes
# from the const in internal/provider/version.go (one source — main.go
# wires it into the User-Agent and the -version flag). check-tag fails
# the release when tag and const disagree, and every build leg asserts
# the binary itself reports the release version via `-version`. No
# ldflags stamping: the version is in the source, so what the binary
# reports is what the tag's commit built.
#
# Archive shape is REGISTRY-SHAPED, two levels of naming: the ZIP is
# `terraform-provider-fluxvale_<version>_<os>_<arch>.zip` — zip on ALL
# platforms, os/arch in GOOS/GOARCH vocabulary, no `v`, NO version
# directory in mirror use — and the binary INSIDE is
# `terraform-provider-fluxvale_v<version>` (the `v` lives on the
# binary; `.exe` rides it on Windows — tofu's providercache presumes
# the extension on Windows packages). The zip carries ONLY the binary
# (one entry, asserted); the manifest is its own versioned release
# asset, not a zip member.
#
# Signing: a dedicated company key (public key committed at
# terraform-provider-signing.asc; the private half lives in 1Password
# and in this repo's GPG_PRIVATE_KEY Actions secret — imported here
# per run, never echoed). The publish job detach-signs the merged
# SHA256SUMS; the registries verify the signature against the public
# key uploaded at listing setup.
#
# workflow_dispatch is the DRY RUN: build + archive + checksums land as
# run artifacts and publish never fires — the event gate in publish's
# `if` holds even for a dispatch pointed at a tag ref. The tag path is
# entered only by pushing a `v*` tag.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-tag:
    name: Tag matches version.go version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assert the tag's version equals the provider's version source
        run: ./scripts/check-tag-version.sh "$GITHUB_REF_NAME"

  # build deliberately does NOT need check-tag: a `needs` here would
  # skip the matrix on branch dispatches (check-tag is ref-gated) and
  # kill the dry run. The cost: a tag that fails check-tag still burns
  # one matrix run — publish (which needs both) is what actually gates
  # the release.
  build:
    name: Build + archive (${{ matrix.leg.name }})
    runs-on: ${{ matrix.leg.os }}
    strategy:
      fail-fast: false
      matrix:
        leg:
          - name: linux-amd64
            os: ubuntu-24.04
            os_arch: linux_amd64
            binary: terraform-provider-fluxvale
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            os_arch: linux_arm64
            binary: terraform-provider-fluxvale
          - name: macos-aarch64
            os: macos-latest
            os_arch: darwin_arm64
            binary: terraform-provider-fluxvale
          - name: windows-x64
            os: windows-latest
            os_arch: windows_amd64
            binary: terraform-provider-fluxvale.exe
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same install as ci.yml: parse (not install) from mise.toml —
      # the release build and the per-PR proof can't drift from the
      # pin. shell: bash on every leg: pwsh (the Windows default) can't
      # parse this sed/GITHUB_OUTPUT script.
      - name: Read Go version from mise.toml
        id: go
        run: |
          version="$(sed -n 's/^go *= *"\([^"]*\)".*/\1/p' mise.toml)"
          echo "go=$version"
          test -n "$version"
          echo "go=$version" >>"$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go.outputs.go }}
          # Release artifacts build from a cold cache: nothing restored
          # can enter a published, checksummed binary (zizmor's
          # cache-poisoning class). The PR lane keeps caching — different
          # risk posture, nothing it builds is published.
          cache: false

      - name: Build the provider binary
        run: go build -trimpath -o ${{ matrix.leg.binary }} .

      # The release version: the tag's, in tag mode (check-tag already
      # asserted version.go equality); version.go's in the dispatch dry
      # run (no tag — and that is the same const the binary's -version
      # prints). The charset guard is injection-safety only — it accepts
      # semver's whole grammar because grammar policy lives in
      # version.go via check-tag, not here.
      - name: Parse the release version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -n 's/^const Version = "\([^"]*\)"/\1/p' internal/provider/version.go | head -1)"
          fi
          case "$version" in
            *[!0-9A-Za-z.+-]*) echo "::error::release version '$version' has characters outside semver's grammar"; exit 1 ;;
          esac
          test -n "$version"
          echo "release version: $version"
          {
            echo "version<<EOF"
            echo "$version"
            echo "EOF"
          } >>"$GITHUB_OUTPUT"

      # The end-to-end version proof, per leg: the binary that goes in
      # the archive must self-report the release version. VERSION is
      # env-indirected, not ${{ }}-inline — the house posture for
      # caller-influenced values (the tag name is one).
      - name: Assert the binary reports the release version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          actual="$(./${{ matrix.leg.binary }} -version)"
          echo "binary reports: $actual"
          case "$actual" in
            *" $VERSION") echo "matches the release version" ;;
            *) echo "::error::terraform-provider-fluxvale -version ($actual) does not carry the release version ($VERSION)"; exit 1 ;;
          esac

      # The registry manifest: schema v1, protocol 6.0 (the provider is
      # pure terraform-plugin-framework — no sdkv2, no protocol 5).
      # Written per leg but NOT zipped: the registry convention (verify
      # against live provider releases — github/datadog/docker) uploads
      # it as a VERSIONED release asset,
      # terraform-provider-fluxvale_<version>_manifest.json, and the
      # zips carry only the binary. Publish names it, checksums it,
      # and attaches it.
      - name: Write the registry manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cat > "terraform-provider-fluxvale_${VERSION}_manifest.json" <<'EOF'
          {
            "version": 1,
            "metadata": {
              "protocol_versions": ["6.0"]
            }
          }
          EOF
          cat "terraform-provider-fluxvale_${VERSION}_manifest.json"

      # Registry-shaped archive, two levels of naming (see the header):
      # the zip keeps its `_<version>_<os>_<arch>` name; the binary is
      # STAGED under the registry's inner name —
      # `terraform-provider-fluxvale_v<version>` — flat at the zip
      # root, and the zip carries NOTHING else (the convention the
      # registries and filesystem mirrors expect; the manifest rides
      # as its own release asset, not inside the zip). The proof
      # ASSERTS the exact entry list with BOTH sides sorted — an
      # order-vs-alphabetical mismatch once reded every unix leg.
      - name: Archive the binary (unix)
        if: runner.os != 'Windows'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          OS_ARCH: ${{ matrix.leg.os_arch }}
        run: |
          archive="terraform-provider-fluxvale_${VERSION}_${OS_ARCH}.zip"
          inner="terraform-provider-fluxvale_v${VERSION}"
          cp "${{ matrix.leg.binary }}" "$inner"
          zip -q "$archive" "$inner"
          entries="$(unzip -Z1 "$archive" | sort)"
          echo "archive entries: $entries"
          want="$(printf '%s\n' "$inner" | sort)"
          if [ "$entries" != "$want" ]; then
            echo "::error::$archive entries = [$entries], want exactly [$want]"
            exit 1
          fi

      - name: Archive the binary (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          OS_ARCH: ${{ matrix.leg.os_arch }}
        run: |
          $archive = "terraform-provider-fluxvale_${env:VERSION}_${env:OS_ARCH}.zip"
          # The inner name carries .exe on Windows — tofu's providercache
          # (CachedProvider.ExecutableFile) presumes it: an extension-less
          # file is detected as the executable but fails to run.
          $inner = "terraform-provider-fluxvale_v${env:VERSION}.exe"
          Copy-Item "${{ matrix.leg.binary }}" $inner
          Compress-Archive -Path $inner -DestinationPath $archive
          # Flat-entry proof: exactly one root entry, the registry-named
          # binary (the manifest is a release asset, not a zip member).
          $entries = ([System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $archive))).Entries |
            Select-Object -ExpandProperty FullName | Sort-Object
          Write-Host "archive entries: $entries"
          if ("$entries" -ne "$inner") {
            Write-Error "::error::$archive entries = [$entries], want exactly [$inner]"
            exit 1
          }

      # Per-leg checksum part (the zip only); publish merges the parts,
      # appends the manifest's line, and signs the versioned whole.
      # shasum is macOS's fallback (same `<hash>  <file>` format).
      - name: Checksum the archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
          OS_ARCH: ${{ matrix.leg.os_arch }}
        run: |
          archive="terraform-provider-fluxvale_${VERSION}_${OS_ARCH}.zip"
          test -f "$archive" || { echo "::error::no archive for this leg"; exit 1; }
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "SHA256SUMS.${OS_ARCH}"
          else
            shasum -a 256 "$archive" > "SHA256SUMS.${OS_ARCH}"
          fi
          cat "SHA256SUMS.${OS_ARCH}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.leg.name }}
          path: |
            terraform-provider-fluxvale_*.zip
            terraform-provider-fluxvale_*_manifest.json
            SHA256SUMS.*
          if-no-files-found: error

  # Pushes of `v*` tags only. Dispatch NEVER publishes — including a
  # dispatch pointed at a tag ref (`gh workflow run --ref v1.2.3` is
  # legal), which is why the event gate is in the `if` below, not just
  # the trigger. A failed build also auto-skips this job, so the
  # conjunction below is exact: publish fires on a green,
  # version-checked tag push, nothing else.
  publish:
    name: Publish GitHub Release
    needs: [check-tag, build]
    if: github.event_name == 'push' && needs.build.result == 'success' && needs.check-tag.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # The checkout backs the release notes' doc links and carries the
      # committed public key used to verify the signature proof below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Merge and verify the checksums
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${REF_NAME#v}"
          cd dist
          cat SHA256SUMS.* > "terraform-provider-fluxvale_${version}_SHA256SUMS"
          rm SHA256SUMS.*
          # The manifest is a checksummed release asset like the zips
          # (the scaffolding convention: checksum.extra_files) — one
          # line, appended here so it appears exactly once no matter
          # how many legs wrote parts.
          sha256sum "terraform-provider-fluxvale_${version}_manifest.json" >> "terraform-provider-fluxvale_${version}_SHA256SUMS"
          cat "terraform-provider-fluxvale_${version}_SHA256SUMS"
          sha256sum -c "terraform-provider-fluxvale_${version}_SHA256SUMS"

      # The registry layout wants one zip per os_arch — name the four,
      # never a glob that could quietly match three.
      - name: Assert the artifact set is complete
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${REF_NAME#v}"
          for os_arch in linux_amd64 linux_arm64 darwin_arm64 windows_amd64; do
            if [ ! -f "dist/terraform-provider-fluxvale_${version}_${os_arch}.zip" ]; then
              echo "::error::missing dist/terraform-provider-fluxvale_${version}_${os_arch}.zip"
              exit 1
            fi
          done

      # Registry signing: import the company key from the Actions
      # secret (held in 1Password as the source of truth), detach-sign
      # the versioned SHA256SUMS in BINARY form (the registry spec: a
      # binary, not ASCII-armored, detached signature — --armor would
      # write .asc and the registries would refuse it), pinned to the
      # company key id so an accidentally-populated keyring can never
      # pick a different signer. Then PROVE the signature against the
      # committed public key — verified in a FRESH GNUPGHOME holding
      # only the committed key, so the release can never ship a
      # signature the committed key can't verify. The key has NO
      # passphrase by design (the private material is the secret), so
      # no prompt path exists; every gpg call is --batch with loopback
      # pinentry — non-interactive or the step reds, never a dialog.
      - name: Sign the checksums
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${REF_NAME#v}"
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --pinentry-mode loopback --import
          cd dist
          gpg --batch --pinentry-mode loopback --yes --local-user 0B835C3828029111 --detach-sig "terraform-provider-fluxvale_${version}_SHA256SUMS"
          proof_home="$(mktemp -d)"
          GNUPGHOME="$proof_home" gpg --batch --pinentry-mode loopback --import ../terraform-provider-signing.asc
          GNUPGHOME="$proof_home" gpg --batch --pinentry-mode loopback --verify "terraform-provider-fluxvale_${version}_SHA256SUMS.sig" "terraform-provider-fluxvale_${version}_SHA256SUMS"
          rm -rf "$proof_home"

      # Install primer: manual-first until the registries list us (the
      # listing is a manual org-connect step tracked outside this repo);
      # once live, `terraform init` replaces the mirror recipe.
      - name: Compose the release notes
        env:
          REF_NAME: ${{ github.ref_name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          cat > notes.md <<EOF
          ## Install

          Until the registry listing goes live, install from this release into a
          [filesystem mirror](https://opentofu.org/docs/cli/config/files/): download the zip for
          your platform, verify your line of the versioned checksums
          (\`grep <your-zip> terraform-provider-fluxvale_*_SHA256SUMS | sha256sum -c -\`) — the
          signature over the whole set is the \`.sig\` beside it, verifiable against the committed
          [\`terraform-provider-signing.asc\`](${REPO_URL}/blob/${REF_NAME}/terraform-provider-signing.asc).

          The full copy-paste recipe — mirror layout, checksum verify, the CLI
          \`provider_installation\` block, and the dev_overrides loop — lives in
          [docs/guides/install.md](${REPO_URL}/blob/${REF_NAME}/docs/guides/install.md).
          EOF
          cat notes.md

      # The release title strips the v prefix — the tag is for the
      # trigger and the archives, the title is for humans.
      - name: Derive the release title
        id: title
        run: echo "name=fluxvale Terraform provider ${GITHUB_REF_NAME#v}" >>"$GITHUB_OUTPUT"

      # v3.0.3 — pinned to the SAME commit the monorepo's release
      # lanes use: one reviewed action version across the org. Notes:
      # the static primer (composed above), not auto-generated notes.
      # The versioned asset names are the registry's convention
      # (manifest, SHA256SUMS, SHA256SUMS.sig — all carrying the
      # version, so releases coexist unambiguously).
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ steps.title.outputs.name }}
          body_path: notes.md
          files: |
            dist/terraform-provider-fluxvale_*.zip
            dist/terraform-provider-fluxvale_*_manifest.json
            dist/terraform-provider-fluxvale_*_SHA256SUMS
            dist/terraform-provider-fluxvale_*_SHA256SUMS.sig
          fail_on_unmatched_files: true
